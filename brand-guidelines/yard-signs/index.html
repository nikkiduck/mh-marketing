<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Moved from monthausint.com/assets/marketing on 2026-10-10 (Nikki): the portal links here. -->
  <title>Yard Sign Templates, Mont Haus</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Public Sans', sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .page-header {
      background: #111;
      padding: 20px 32px;
    }
    .page-header h1 {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .page-header p {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 2px;
    }

    .content { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }

    .option-section { margin-bottom: 48px; }
    .option-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #6b7280;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 20px;
    }

    .sign-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 720px) {
      .sign-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .sign-grid { grid-template-columns: 1fr; }
    }

    .sign-item { /* plain container — no card appearance */ }

    .sign-image {
      width: 100%;
      display: block;
      border: 1px solid #d1d5db;
      box-shadow: 0 1px 4px rgba(0,0,0,.10);
      transition: box-shadow .15s, transform .15s;
    }
    .sign-item:hover .sign-image {
      box-shadow: 0 6px 16px rgba(0,0,0,.14);
      transform: translateY(-2px);
    }

    .sign-label {
      margin-top: 8px;
      padding: 0 2px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: .2px;
    }
  </style>
</head>
<body>

<header class="page-header">
    <p style="margin:0 0 6px"><a href="/brand-guidelines/" style="color:#9ca3af;font-size:12px;text-decoration:none">&larr; Brand guidelines</a></p>
  <h1>Yard Sign Templates</h1>
  <p>Mont Haus International Realty. Design options for reference.</p>
</header>

<div class="content">

  <!-- Team versions removed 2026-10-29 (Nikki): broker signs only. -->
  <div class="sign-grid">
    <div class="sign-item">
      <img class="sign-image" src="img/option-1-broker.png" alt="Yard sign, option 1">
      <div class="sign-label">Option 1</div>
    </div>
    <div class="sign-item">
      <img class="sign-image" src="img/option-2-broker.png" alt="Yard sign, option 2">
      <div class="sign-label">Option 2</div>
    </div>
    <div class="sign-item">
      <img class="sign-image" src="img/option-3-broker.png" alt="Yard sign, option 3">
      <div class="sign-label">Option 3</div>
    </div>
  </div>

</div>
</body>
</html>
