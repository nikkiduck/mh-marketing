# ============================================================================
#  qr.monthaus.com — Apache virtual host
#
#  The address printed inside every Mont Haus QR code. It has no pages: every
#  request is handed to /var/www/marketing.monthaus.com/qr.php, which looks the
#  path up in qr_codes and 302s to wherever that code points today. Codes are
#  managed at https://marketing.monthaus.com/qr_codes.php.
#
#  Same instance, same docroot, same database as marketing.monthaus.com. But
#  this vhost serves exactly ONE file: the rewrite below uses [END], so no
#  other path under the docroot (inc/, sql/, pages) is reachable through this
#  hostname, and .htaccess is switched off here because nothing else is served.
#
#  First-time setup (full commands in CLAUDE.md, "Dynamic QR codes"):
#    1. DNS: A record  qr.monthaus.com -> the instance's static IP
#    2. sudo mkdir -p /var/www/letsencrypt
#       sudo cp /var/www/marketing.monthaus.com/deploy/qr.monthaus.com.conf /etc/apache2/sites-available/
#       sudo a2ensite qr.monthaus.com && sudo apache2ctl configtest && sudo systemctl reload apache2
#    3. sudo certbot certonly --webroot -w /var/www/letsencrypt -d qr.monthaus.com
#    4. sudo systemctl reload apache2
#
#  Why the :443 block is wrapped in <IfFile>: it cannot load before the
#  certificate exists, and the certificate cannot be issued until the :80
#  block is answering the ACME challenge. With the guard, one file does both
#  stages and nothing has to be edited in between. After step 3 the file
#  exists and the reload brings HTTPS up.
#
#  Why --webroot and not --apache: the Apache plugin rewrites vhost files, and
#  on this box that is how 000-default.conf and default-ssl.conf ended up
#  claiming marketing.monthaus.com (see marketing.monthaus.com.conf). Webroot
#  touches no Apache config, and renewals reuse the same Alias below.
# ============================================================================

<VirtualHost *:80>
    ServerName qr.monthaus.com

    # Let's Encrypt HTTP-01 challenges, for issue and every renewal.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Everything else to HTTPS. The printed codes are https already; this is
    # for anyone typing the address by hand.
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://qr.monthaus.com%{REQUEST_URI} [END,NE,R=301]

    ErrorLog  ${APACHE_LOG_DIR}/qr_error.log
    CustomLog ${APACHE_LOG_DIR}/qr_access.log combined
</VirtualHost>


<IfFile "/etc/letsencrypt/live/qr.monthaus.com/fullchain.pem">
<VirtualHost *:443>
    ServerName qr.monthaus.com
    DocumentRoot /var/www/marketing.monthaus.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/qr.monthaus.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/qr.monthaus.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/marketing.monthaus.com>
        Options -Indexes
        # Off on purpose: this host serves one file and needs no per-directory
        # rules. The marketing vhost's AllowOverride All is scoped to that
        # vhost and does not apply here.
        AllowOverride None
        Require all granted
    </Directory>

    # Every path, including /, goes to qr.php. [END] stops all further
    # rewriting, so nothing else in the docroot can be reached from this host.
    # qr.php reads the original path from REQUEST_URI.
    RewriteEngine on
    RewriteRule ^ /qr.php [END]

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/qr_error.log
    CustomLog ${APACHE_LOG_DIR}/qr_access.log combined
</VirtualHost>
</IfFile>
