# ============================================================================
#  marketing.monthaus.com — Apache virtual host
#
#  Serves the Mont Haus marketing tool from /var/www/marketing.monthaus.com.
#
#  This REPLACES the Certbot-modified 000-default.conf and default-ssl.conf,
#  which both claimed this hostname and pointed at /var/www/html. Apache loads
#  sites alphabetically and takes the first name match, so those files won
#  every request and this vhost never ran. Disable them:
#
#      sudo a2dissite 000-default default-ssl
#
#  Confirm with `sudo apache2ctl -S` that only this file claims the name.
#
#  The TLS certificate below is the existing Let's Encrypt one, not a new
#  issue — Let's Encrypt rate-limits duplicate certificates.
# ============================================================================

<VirtualHost *:80>
    ServerName marketing.monthaus.com

    # Everything goes to HTTPS, and this is load-bearing rather than tidiness:
    # the OAuth redirect URI registered with Microsoft is https, and auth.php
    # sets session.cookie_secure, so a session cookie will not survive a plain
    # HTTP request at all.
    #
    # Kept verbatim from what Certbot wrote into 000-default.conf, so the
    # renewal hook still recognises the shape it expects.
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =marketing.monthaus.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/marketing_error.log
    CustomLog ${APACHE_LOG_DIR}/marketing_access.log combined
</VirtualHost>


<VirtualHost *:443>
    ServerName marketing.monthaus.com
    DocumentRoot /var/www/marketing.monthaus.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/marketing.monthaus.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/marketing.monthaus.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/marketing.monthaus.com>
        Options -Indexes +FollowSymLinks

        # Required. apache2.conf sets AllowOverride None on <Directory /var/www/>
        # and All only on <Directory "/var/www/html">. Without this line the
        # site's .htaccess is silently ignored.
        AllowOverride All

        Require all granted
    </Directory>

    # ── Everything that is code rather than a page ──────────────────────────
    #
    # The docroot holds only the files that correspond to URLs. Every include,
    # migration, test and library lives in one of these directories, and none
    # of them should ever answer a request.
    #
    #   inc/     auth, db, config, sso, mailer, the partials —
    #            db.php and sso_config.php live here, holding the database
    #            password and the Entra client secret
    #   sql/     migrations          tests/   the sign-in test suite
    #   cron/    CLI-only scripts    vendor/  PHPMailer
    #   deploy/  samples and this file        docs/  markdown
    #
    # This duplicates .htaccess on purpose: .htaccess works only while the
    # AllowOverride above survives, and a config-level deny does not depend
    # on that. Credentials stay protected either way.
    <DirectoryMatch "^/var/www/marketing\.monthaus\.com/(inc|sql|tests|cron|vendor|deploy|docs)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Belt and braces: deny the credential filenames wherever they appear.
    <FilesMatch "^(db|db\.sample|auth|sso|sso_config|sso_config\.sample|config|mailer|_footer|_nav|_onboarding)\.php$">
        Require all denied
    </FilesMatch>

    # json and md are deliberately absent: the theme ships 16 json files under
    # assets/, including the i18n locales the login page fetches at runtime.
    # composer.json and the markdown docs sit in deploy/, docs/ and vendor/,
    # already denied by the DirectoryMatch above.
    <FilesMatch "\.(sql|log|lock|py|bak|old|orig|swp|env|conf|example)$">
        Require all denied
    </FilesMatch>

    # The MLS key debugger is admin-gated in code, but there is no reason to
    # leave it reachable in normal operation. Comment out when you need it.
    <FilesMatch "^mls_key_debug\.php$">
        Require all denied
    </FilesMatch>

    # ── Security headers ────────────────────────────────────────────────────
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"

        # strict-origin-when-cross-origin, not same-origin: the sign-in
        # redirect to Microsoft is cross-site, and same-origin would strip
        # the Referer from it entirely.
        Header always set Referrer-Policy "strict-origin-when-cross-origin"

        Header always set Strict-Transport-Security "max-age=31536000"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/marketing_error.log
    CustomLog ${APACHE_LOG_DIR}/marketing_access.log combined
</VirtualHost>
